name: Create signing key (run once)

# Creates ONE permanent signing key for SimoMusic and stores it as repository secrets, so every build
# afterwards (build.yml) is signed with the same key and updates install over each other.
#
# Run it once: Actions > "Create signing key (run once)" > Run workflow.
#
# Best (fully automatic): add a repository secret named GH_PAT first - a fine-grained token for this repo with
#   "Secrets: Read and write" permission. The workflow then writes the four secrets itself and nothing
#   sensitive is ever shown or uploaded.
# Without GH_PAT: the key is attached as a 1-day artifact; copy the 4 values into Settings > Secrets > Actions,
#   then delete the artifact. (Do this only in a PRIVATE repository.)
#
# If KEYSTORE_BASE64 already exists the workflow stops, so a working key can never be replaced by accident.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Replace the existing key (apps signed with the old key can NOT be updated!)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Stop if a key already exists
        env:
          EXISTING: ${{ secrets.KEYSTORE_BASE64 }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -n "$EXISTING" ] && [ "$FORCE" != "true" ]; then
            echo "::error::KEYSTORE_BASE64 already exists. Nothing was changed. (Run again with 'force' only if you really want a NEW key.)"
            exit 1
          fi

      - name: Generate the key
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ks"
          PASS="$(openssl rand -hex 20)"
          echo "::add-mask::$PASS"
          ALIAS="simomusic"
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/ks/release.jks" \
            -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=SimoMusic, OU=SimoMusic, O=SimoMusic, C=US" >/dev/null
          B64="$(base64 -w0 "$RUNNER_TEMP/ks/release.jks")"
          echo "::add-mask::$B64"
          {
            echo "PASS=$PASS"
            echo "ALIAS=$ALIAS"
            echo "B64=$B64"
          } > "$RUNNER_TEMP/ks/vals.env"

      - name: Save as repository secrets (needs GH_PAT)
        id: save
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "saved=false" >> "$GITHUB_OUTPUT"
            echo "No GH_PAT secret: the key will be offered as a short-lived artifact instead."
            exit 0
          fi
          . "$RUNNER_TEMP/ks/vals.env"
          gh secret set KEYSTORE_BASE64   --repo "$GITHUB_REPOSITORY" --body "$B64"
          gh secret set KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$PASS"
          gh secret set KEY_PASSWORD      --repo "$GITHUB_REPOSITORY" --body "$PASS"
          gh secret set KEY_ALIAS         --repo "$GITHUB_REPOSITORY" --body "$ALIAS"
          echo "saved=true" >> "$GITHUB_OUTPUT"
          echo "Done. The key is stored in repository secrets. Every build is now signed with it."

      - name: Prepare manual copy (no GH_PAT)
        if: steps.save.outputs.saved != 'true'
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/ks/vals.env"
          mkdir -p "$RUNNER_TEMP/out"
          printf '%s' "$B64"   > "$RUNNER_TEMP/out/KEYSTORE_BASE64.txt"
          printf '%s' "$PASS"  > "$RUNNER_TEMP/out/KEYSTORE_PASSWORD.txt"
          printf '%s' "$PASS"  > "$RUNNER_TEMP/out/KEY_PASSWORD.txt"
          printf '%s' "$ALIAS" > "$RUNNER_TEMP/out/KEY_ALIAS.txt"
          cp "$RUNNER_TEMP/ks/release.jks" "$RUNNER_TEMP/out/release.jks"

      - name: Offer the key as artifact (no GH_PAT)
        if: steps.save.outputs.saved != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signing-key-KEEP-PRIVATE
          path: ${{ runner.temp }}/out/*
          retention-days: 1
          if-no-files-found: error
