name: Build Release

# Runs ONLY when you press it: Actions > "Build Release" > Run workflow.
# (No automatic builds on push, pull request or tag.)
#
# Always builds a RELEASE apk signed with the permanent key stored in the repository secrets
# (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). The same secrets = the same key on every
# build, so each new apk installs over the previous one. If a secret is missing the build STOPS instead of
# silently signing with a different (debug) key.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0)'
        type: string
        default: '1.0'
      publish:
        description: 'Also publish a GitHub Release with the apk'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # only used when "publish" is ticked
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # The log you sent ("Task 'assembleDebug' not found in root project") means Gradle loaded a project with no
      # Android module: settings.gradle / app/build.gradle were not where Gradle looked. This step finds the real
      # project folder (even if the zip was uploaded inside a sub-folder) or stops with a clear list of what is there.
      - name: Locate the Android project
        run: |
          set -euo pipefail
          DIR=""
          for d in . $(find . -maxdepth 3 -name settings.gradle -not -path './.git/*' -printf '%h\n' | sort -u); do
            if [ -f "$d/settings.gradle" ] && [ -f "$d/app/build.gradle" ] && [ -d "$d/app/src/main" ]; then DIR="$d"; break; fi
          done
          if [ -z "$DIR" ]; then
            echo "::error::Android project not found. The repository must contain settings.gradle, build.gradle and app/ (with app/build.gradle and app/src/main). Files I can see:"
            find . -maxdepth 3 -not -path './.git/*' | sort | head -80
            exit 1
          fi
          echo "Project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Prepare the permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Secret $v is missing. Add the signing secrets first (the build never falls back to another key)."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Key fingerprint (must be identical on every build):"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -i "SHA-256\|SHA256" || true

      - name: Build release apk
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ inputs.version }}
        run: cd "$PROJECT_DIR" && gradle --no-daemon :app:assembleRelease

      - name: Rename apk
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          APK="$(ls "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk | head -n1)"
          cp "$APK" "$GITHUB_WORKSPACE/SimoMusic-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SimoMusic-apk
          path: SimoMusic-${{ inputs.version }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: SimoMusic ${{ inputs.version }}
          files: SimoMusic-${{ inputs.version }}.apk
